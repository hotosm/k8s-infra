apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: mlflow-prod-db-store
  namespace: postgres
spec:
  retentionPolicy: "60d"
  configuration:
    destinationPath: s3://hotosm-k8s-db-backup/mlflow-prod
    endpointURL: https://s3.amazonaws.com
    s3Credentials:
      accessKeyId:
        name: s3-creds
        key: access-key-id
      secretAccessKey:
        name: s3-creds
        key: secret-access-key
    wal:
      compression: gzip
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
      jobs: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mlflow-prod-db
  namespace: postgres
  labels:
    app.kubernetes.io/component: database
spec:
  instances: 2
  description: "MLflow Production Database"
  imageName: "ghcr.io/cloudnative-pg/postgresql:18-system-trixie"
  primaryUpdateStrategy: unsupervised
  # PDB (voluntary-eviction guard) enabled - drains wait for failover, only safe at instances >= 2
  enablePDB: true
  # Recreating this Cluster restores from S3, instead of starting empty.
  # A rebuild also needs a fresh archiver serverName - docs/tutorial/postgres.md
  bootstrap:
    recovery:
      source: mlflow-prod-db
  externalClusters:
    - name: mlflow-prod-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: mlflow-prod-db-store
          serverName: mlflow-prod-db-v2

  # How this database was first created, kept for a from-scratch rebuild:
  # bootstrap:
  #   initdb:
  #     database: mlflow
  #     owner: mlflow
  #     secret:
  #       name: mlflow-prod-db-creds

  storage:
    storageClass: gp3
    size: 50Gi
  walStorage:
    storageClass: gp3
    size: 32Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mlflow-prod-db-store
        # Fresh archive, as the old one was permanently broken
        serverName: mlflow-prod-db-v2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mlflow-prod-db-backup
  namespace: postgres
spec:
  schedule: "0 0 4 * * 0"
  backupOwnerReference: self
  cluster:
    name: mlflow-prod-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# Scrape metrics into Prometheus. Manual, as spec.monitoring.enablePodMonitor
# is deprecated; same labels and port the operator used to generate.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mlflow-prod-db-podmonitor
  namespace: postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: mlflow-prod-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
