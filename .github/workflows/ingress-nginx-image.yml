name: Build ingress-nginx image

on:
  pull_request:
    paths:
      - images/ingress-nginx/**
      - .github/workflows/ingress-nginx-image.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push images to GHCR
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: images/ingress-nginx

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork-release:
    name: Check fork release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check for a newer fork release
        run: |
          source versions.env
          latest=$(git ls-remote --tags --refs "$FORK_REPO" 'controller-v*' | awk -F/ '{print $3}' | sort -V | tail -1)
          echo "pinned $FORK_REF, latest $latest"
          if [[ $latest != "$FORK_REF" ]]; then
            echo "::warning::new fork release: $latest"
            [[ $GITHUB_EVENT_NAME != schedule ]]
          fi

  build:
    name: Build, verify and push
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}/ingress-nginx
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install trivy
        run: |
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  trivy.tgz" | sha256sum -c -
          sudo tar -xzf trivy.tgz -C /usr/local/bin trivy
          rm trivy.tgz

      - run: ./build.sh build
      - run: ./build.sh verify

      - if: inputs.push && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: inputs.push && github.ref == 'refs/heads/main'
        run: ./build.sh push
        env:
          EXTRA_TAG: sha-${{ github.sha }}

      - name: Summary
        run: |
          source versions.env
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ingress-nginx controller $CONTROLLER_TAG

          | | |
          |---|---|
          | Fork | \`$FORK_REF\` (\`${FORK_COMMIT:0:7}\`) |
          | nginx | $NGINX_VERSION, $(wc -l < work/out/patches.txt)/$NGINX_PATCHES patches applied |
          | Go | $GO_VERSION |
          | Trivy | no fixable critical or high vulnerabilities |
          EOF

          [[ -f work/out/images.env ]] || exit 0
          source work/out/images.env
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ### Images

          - \`$BASE_IMAGE\`
          - \`$CONTROLLER_IMAGE\`

          Also tagged \`$EXTRA_TAG\`.

          ### Helm values

          \`\`\`yaml
          controller:
            image:
              registry: ghcr.io
              image: ${REGISTRY#ghcr.io/}/controller
              tag: $CONTROLLER_TAG
              digest: ${CONTROLLER_IMAGE#*@}
          \`\`\`
          EOF
        env:
          EXTRA_TAG: sha-${{ github.sha }}
