apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fair-production
  namespace: argocd
spec:
  project: default
  sources:
    # 1. fAIr Backend
    - repoURL: oci://ghcr.io/hotosm/charts/fair
      chart: fair
      # Simply deploy the most recent chart version published
      targetRevision: "*"
      helm:
        releaseName: fair-backend
        valueFiles:
          - $k8s-infra/apps/fair/backend/helm/values.yaml

    # 2. STAC / eoAPI
    - repoURL: https://devseed.com/eoapi-k8s
      chart: eoapi
      targetRevision: 0.12.2
      helm:
        releaseName: fair-eoapi
        skipCrds: false
        passCredentials: false
        valueFiles:
          - $k8s-infra/apps/fair/eoapi/helm/values.yaml

    # 3. MLflow
    - repoURL: https://community-charts.github.io/helm-charts
      chart: mlflow
      targetRevision: 1.8.1
      helm:
        releaseName: mlflow
        valueFiles:
          - $k8s-infra/apps/fair/mlflow/helm/values.yaml

    # 4. ZenML
    - repoURL: oci://public.ecr.aws/zenml/zenml
      chart: zenml
      targetRevision: 0.94.2
      helm:
        releaseName: zenml
        valueFiles:
          - $k8s-infra/apps/fair/zenml/helm/values.yaml

    # 5. Reference to this infrastructure repo (required for valueFiles mapping)
    - repoURL: https://github.com/hotosm/k8s-infra.git
      targetRevision: HEAD
      ref: k8s-infra

    # 6. Apply all extra resources (Sealed Secrets, RBAC, etc.) in the root folder
    - repoURL: https://github.com/hotosm/k8s-infra.git
      targetRevision: HEAD
      path: apps/fair

  destination:
    server: https://kubernetes.default.svc
    namespace: fair-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true