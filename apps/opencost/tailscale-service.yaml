apiVersion: v1
kind: Service
metadata:
  name: opencost-tailscale
  namespace: opencost
  annotations:
    tailscale.com/hostname: "opencost"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/instance: opencost
  ports:
    # UI, which proxies to the exporter API internally
    - protocol: TCP
      port: 80
      targetPort: 9090
