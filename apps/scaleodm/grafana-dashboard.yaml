# Auto-imported by the Grafana sidecar in apps/monitoring (label grafana_dashboard,
# searchNamespaces: ALL). Applied by the `path: apps/scaleodm` source in
# apps/scaleodm.yaml. Queries are documented in apps/monitoring/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scaleodm-dashboard
  namespace: odm
  labels:
    grafana_dashboard: "1"
data:
  scaleodm.json: |
    {
      "title": "ScaleODM / ODM jobs",
      "uid": "scaleodm-jobs",
      "tags": ["scaleodm", "argo", "odm"],
      "timezone": "browser",
      "time": { "from": "now-24h", "to": "now" },
      "refresh": "1m",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Workflows",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries",
          "title": "Workflows by phase (cluster-wide)",
          "description": "argo_workflows_gauge is a controller-level gauge with no namespace attribute, so this covers ScaleODM and OAM uploader together.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (status) (argo_workflows_gauge)",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "ODM workflows entering each phase (per hour)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (phase) (rate(argo_workflows_total_count{namespace=\"odm\"}[1h])) * 3600",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "ODM job duration (p50 / p95)",
          "description": "From the workflow_duration_seconds histogram declared in apps/scaleodm/helm/values.yaml.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(workflow_duration_seconds_bucket{workflow_namespace=\"odm\"}[6h])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(workflow_duration_seconds_bucket{workflow_namespace=\"odm\"}[6h])))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Controller queue depth",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (queue_name) (argo_workflows_queue_depth_gauge)",
              "legendFormat": "{{queue_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Resources per job",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 }
        },
        {
          "type": "timeseries",
          "title": "Memory working set per ODM job",
          "description": "cAdvisor joined to kube_pod_labels via the allowlisted Argo pod label (apps/monitoring/helm/values.yaml).",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 18 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (label_workflows_argoproj_io_workflow) (\n  container_memory_working_set_bytes{namespace=\"odm\", container!=\"\"}\n  * on (namespace, pod) group_left(label_workflows_argoproj_io_workflow)\n    kube_pod_labels{namespace=\"odm\"}\n)",
              "legendFormat": "{{label_workflows_argoproj_io_workflow}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory used vs requested vs limit (odm namespace)",
          "description": "If used tracks well below requested, memoryMaxGiB / swapRatio in apps/scaleodm/helm/values.yaml are over-provisioning. Used pinning flat at the limit means the cgroup cap is being hit and the overflow is going to swap.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 18 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"odm\", container!=\"\"})",
              "legendFormat": "used",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(kube_pod_container_resource_requests{namespace=\"odm\", resource=\"memory\"})",
              "legendFormat": "requested",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"odm\", resource=\"memory\"})",
              "legendFormat": "limit",
              "refId": "C"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Container termination reasons (odm namespace)",
          "description": "All reasons, not just OOMKilled. A job that vanishes with no reason is eviction or external deletion rather than a cgroup OOM; that distinction is otherwise unrecoverable after the pod is gone.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (pod, reason) (kube_pod_container_status_last_terminated_reason{namespace=\"odm\"})",
              "legendFormat": "{{pod}} / {{reason}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pods pending (waiting on Karpenter capacity)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(kube_pod_status_phase{namespace=\"odm\", phase=\"Pending\"})",
              "legendFormat": "pending",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory as % of limit, per ODM job",
          "description": "Sustained 100% means the job is pinned at memory.max and every further allocation is going to swap. That is the point of no return for a large dense reconstruction, and it precedes the kill by minutes.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 35 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 110 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "100 * max by (label_workflows_argoproj_io_workflow) (\n  container_memory_working_set_bytes{namespace=\"odm\", container!=\"\"}\n  * on (namespace, pod) group_left(label_workflows_argoproj_io_workflow)\n    kube_pod_labels{namespace=\"odm\"}\n)\n/ on (label_workflows_argoproj_io_workflow) max by (label_workflows_argoproj_io_workflow) (\n  kube_pod_container_resource_limits{namespace=\"odm\", resource=\"memory\"}\n  * on (namespace, pod) group_left(label_workflows_argoproj_io_workflow)\n    kube_pod_labels{namespace=\"odm\"}\n)",
              "legendFormat": "{{label_workflows_argoproj_io_workflow}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Swap (ScaleODM nodes)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 43 }
        },
        {
          "type": "timeseries",
          "title": "Swap in use vs total, per node",
          "description": "Per-container swap is unavailable (the chart drops container_memory_swap; see apps/monitoring/README.md to re-enable). The pool is dedicated, so node swap is job swap when one ODM pod owns the node. Under LimitedSwap a Burstable container only gets request/nodeRAM of total swap, so a job can exhaust its own allowance well below the node ceiling.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 44 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "(node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes)\n  * on (namespace, pod) group_left(node) kube_pod_info{namespace=\"monitoring\"}",
              "legendFormat": "{{node}} used",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "node_memory_SwapTotal_bytes\n  * on (namespace, pod) group_left(node) kube_pod_info{namespace=\"monitoring\"}",
              "legendFormat": "{{node}} total",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Swap read rate (thrashing)",
          "description": "Full swap is expected by design. A sustained swap-in rate is the signal that swapRatio is too aggressive.",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 44 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "rate(node_vmstat_pswpin[5m])\n  * on (namespace, pod) group_left(node) kube_pod_info{namespace=\"monitoring\"}",
              "legendFormat": "{{node}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
