secrets:
  runtime:
    name: "scaleodm-secrets"
    keys:
      databaseUrl: "SCALEODM_DATABASE_URL"
      s3Endpoint: "AWS_S3_ENDPOINT"
      accessKey: "AWS_ACCESS_KEY_ID"
      secretKey: "AWS_SECRET_ACCESS_KEY"
      region: "AWS_DEFAULT_REGION"

# Deploys the "scaleodm-workspace" storageclass used below. This gp3 volume is
# the ODM working directory: undistort and OpenMVS write heavy intermediate
# files here (undistorted TIFs, depthmaps) at the gp3 baseline of ~125 MiB/s /
# 3000 IOPS. Separate from the node's fast NVMe swap + ephemeral (see
# apps/karpenter/scaleodm-ec2nodeclass.yaml).
#
# Perf note: if undistort or MVS goes I/O-bound (stage stuck at low CPU with the
# job stalled on disk), give it more disk throughput. Either raise this class's
# gp3 throughput/IOPS via the chart (e.g. 500-1000 MiB/s, 6000-16000 IOPS), or
# point workflow.workspace.storageClass below at a custom higher-throughput gp3
# class.
workspaceStorageClass:
  create: true

config:
  observability:
    enabled: false
    serviceName: "scaleodm"
    serviceVersion: ""
    otlpEndpoint: ""
    otlpInsecure: false
    metricsEnabled: true
    tracesEnabled: true
    traceSampleRatio: 0.1

  # Defaults, except gp3 storageclass
  workflow:
    # 48hrs processing deadline
    activeDeadlineSeconds: 172800
    workspace:
      mode: auto
      size: "30Gi"
      # Can't use standard 'gp3' storageclass, as we have Retain on delete
      # but the pv's here are temp and should be cleaned up automatically
      storageClass: "scaleodm-workspace"
      accessMode: ReadWriteOnce
      dynamicSize:
        enabled: true
        maxGiB: 1024
        fallbackMBPerImage: 20
        # Profile order: fastOrtho, then dsmDtm, then standard.
        fastOrtho:
          multiplier: 6
          minGiB: 20
          gibPerImage: 0.075
        standard:
          multiplier: 8
          minGiB: 30
          gibPerImage: 0.10
        # DSM/DTM jobs need more space for DEM outputs and intermediates.
        dsmDtm:
          multiplier: 12
          minGiB: 100
          gibPerImage: 0.15
    retryLimit: 1
    retryBackoffDuration: "60s"
    retryBackoffFactor: "2"
    retryBackoffMaxDuration: "48h"
    ttlSuccessSeconds: 86400
    ttlFailureSeconds: 604800
    podGCStrategy: "OnWorkflowSuccess"
    podGCDeleteDelaySeconds: 300
    # Default Karpenter node pool for workflow pods.
    # "spot" is cheapest; use "on-demand" for stable capacity.
    # Individual submissions can override this via the capacityType API field.
    capacityType: "spot"
    # Jobs >= 5000 images run for hours; pin them to on-demand so a spot
    # eviction can't waste the run.
    onDemandImageThreshold: 5000
    # Target the dedicated ScaleODM pool (apps/karpenter/scaleodm-nodepool.yaml)
    # and tolerate its taint, so ODM jobs get the NVMe/swap nodes and nothing
    # else does. schedulingMode set explicitly (not inherited) so it can't drift.
    schedulingMode: "karpenter"
    nodeSelector: "pool=scaleodm"
    tolerations: "dedicated=scaleodm:NoSchedule"

  processSizing:
    memoryLimitMarginPercent: 20
    memoryMinGiB: 4
    # Peak-estimate ceiling. 600Gi covers ~13k images (~189Gi RAM request), which
    # fits a 256Gi NVMe node + swap. Bigger jobs clamp (and may fail) rather than
    # pend; split-merge will handle them.
    memoryMaxGiB: 600
    # RAM-driven selection: CPU = 0.125 vCPU per GiB of RAM request (r-family
    # ratio), so it always fits the RAM-selected node. cpuLimitMultiplier 0 omits
    # the CPU limit so ODM uses every node core.
    cpuPerGiB: 0.125
    cpuLimitMultiplier: 0
    cpuMaxCores: 0
    ephemeralGiBPerGiBRAM: 0.3
    ephemeralLimitMultiplier: 1.2
    fastOrthoMemoryMultiplier: 0.5
    dsmDtmMemoryMultiplier: 1.5
    # Swap-aware sizing: request = peak / (1 + swapRatio), swap absorbs the peak.
    # Needs the swap-enabled pool (apps/karpenter/scaleodm-ec2nodeclass.yaml),
    # which the nodeSelector above pins pods to.
    swapRatio: 1.0
    memoryRequestMinGiB: 4

argo:
  controller:
    # Only allow 5 jobs to run at a time for now
    parallelism: 5
  artifactRepository:
    archiveLogs: true
    s3:
      bucket: hotosm-argo-logs
      endpoint: s3.amazonaws.com
      region: us-east-1
      insecure: false
      useSDKCreds: false
      accessKeySecret:
        name: argo-logs-s3-creds
        key: AWS_ACCESS_KEY_ID
      secretKeySecret:
        name: argo-logs-s3-creds
        key: AWS_SECRET_ACCESS_KEY
      keyFormat: "{{workflow.namespace}}/{{workflow.name}}/{{pod.name}}"

ingress:
  # Enables ingress that exposes only /ui and /ui/... routes.
  # This is safe with api.service.type=ClusterIP because browser requests hit
  # /ui/api on the same ingress host, then the in-cluster UI handler fetches
  # internal data server-side and returns JSON to the browser.
  # Security guardrail: requires config.ui.enabled=true.
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: processing.drone.hotosm.org
    external-dns.alpha.kubernetes.io/ttl: "300"
    # Redirect to access /ui path by default
    nginx.ingress.kubernetes.io/app-root: /ui
  hosts:
    - host: processing.drone.hotosm.org
  tls:
    - hosts:
        - processing.drone.hotosm.org
      secretName: scaleodm-tls
