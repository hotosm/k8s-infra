apiVersion: v1
kind: Service
metadata:
  name: scaleodm-tailscale
  namespace: odm
  annotations:
    tailscale.com/hostname: "scaleodm"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: scaleodm
    app.kubernetes.io/instance: scaleodm
  ports:
    - protocol: TCP
      port: 80
      targetPort: 31100
