apiVersion: v1
kind: Service
metadata:
  name: knative-dns-dummy
  namespace: fair-prod
spec:
  ports:
    - port: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knative-wildcard-dns
  namespace: fair-prod
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "*.predict.ai.hotosm.org"
    external-dns.alpha.kubernetes.io/ttl: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: "*.predict.ai.hotosm.org"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knative-dns-dummy
                port:
                  number: 80
