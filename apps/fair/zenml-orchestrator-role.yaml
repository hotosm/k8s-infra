# Launched in-cluster by the fAIr backend SA (zenml/opentofu/main.tf).
---
apiVersion: v1
kind: Namespace
metadata:
  name: zenml-pipelines-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zenml-pod-account
  namespace: zenml-pipelines-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # IRSA (AWS-only, see apps/fair/README.md): S3 for pipeline steps.
    eks.amazonaws.com/role-arn: arn:aws:iam::670261699094:role/hotosm-fair-models-bucket-access-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zenml-orchestrator-service-role
  namespace: zenml-pipelines-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zenml-orchestrator-pod-role
  namespace: zenml-pipelines-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zenml-service-binding
  namespace: zenml-pipelines-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zenml-orchestrator-service-role
subjects:
  - kind: ServiceAccount
    name: fair-model-deployer
    namespace: fair-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zenml-pod-binding
  namespace: zenml-pipelines-prod
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zenml-orchestrator-pod-role
subjects:
  - kind: ServiceAccount
    name: zenml-pod-account
    namespace: zenml-pipelines-prod
