backendReplicaCount: 2

image:
  backend:
    repository: ghcr.io/hotosm/fair/api
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: api.ai.hotosm.org
    external-dns.alpha.kubernetes.io/ttl: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: api.ai.hotosm.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fair-prod-api-tls
      hosts:
        - api.ai.hotosm.org

# CNPG cluster in the postgres ns, //databases/fair-prod.yaml
postgres:
  enabled: false
externalDatabase:
  host: fair-prod-db-rw.postgres.svc.cluster.local
  port: 5432
  database: fair_prod
  username: fair_prod_rw
  existingSecret: fair-db-creds
  existingSecretKey: DB_PASSWORD

serviceAccount:
  name: fair-model-deployer

backend:
  # Order matters: fair-api-credentials wins on keys both carry (SECRET_KEY, AWS_*).
  envFrom:
    - secretRef:
        name: fair-prod-secret-env
    - secretRef:
        name: fair-api-credentials

  djangoQ:
    enabled: true

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

  env:
    DJANGO_SETTINGS_MODULE: "config.settings"
    DEBUG: "false"

    HOSTNAME: "api.ai.hotosm.org"
    ALLOWED_HOSTS: "api.ai.hotosm.org,ai.hotosm.org,fair.hotosm.org"
    CORS_ALLOWED_ORIGINS: "https://ai.hotosm.org,https://fair.hotosm.org"
    CSRF_TRUSTED_ORIGINS: "https://ai.hotosm.org,https://api.ai.hotosm.org,https://fair.hotosm.org"
    FRONTEND_URL: "https://ai.hotosm.org"
    API_BASE_URL: "https://api.ai.hotosm.org/api/v1"
    # The app sets no SECURE_PROXY_SSL_HEADER, so behind nginx this 301-loops.
    SECURE_SSL_REDIRECT: "false"
    SERVE_FRONTEND: "false"

    AUTH_PROVIDER: "hanko"
    HANKO_API_URL: "https://login.hotosm.org"
    LOGIN_URL: "https://login.hotosm.org"
    COOKIE_DOMAIN: ".hotosm.org"
    OSM_LOGIN_REDIRECT_URI: "https://ai.hotosm.org/authenticate/"

    FAIR_ZENML_STORE_URL: "https://zenml.ai.hotosm.org"
    ZENML_STORE_URL: "https://zenml.ai.hotosm.org"
    ZENML_CONFIG_PATH: "/tmp/zenml"
    # TODO set once the prod ZenML stack is registered (zenml stack list).
    # ZENML_ACTIVE_STACK_ID: ""
    FAIR_STAC_API_URL: "https://stac.ai.hotosm.org/stac"
    MLFLOW_TRACKING_URI: "http://mlflow.fair-prod.svc.cluster.local:5000"
    RAW_DATA_API_URL: "https://api-prod.raw-data.hotosm.org/v1"

    # fair-py-ops names - KNATIVE_NAMESPACE/KNATIVE_PREDICT_DOMAIN are not read.
    FAIR_KNATIVE_NAMESPACE: "fair-knative"
    FAIR_PREDICT_DOMAIN: "predict.ai.hotosm.org"
    FAIR_LABEL_DOMAIN: "fair-k8s"
    FAIR_UPLOAD_ARTIFACTS: "true"

    BUCKET_NAME: "hotosm-fair-models-production"
    PARENT_BUCKET_FOLDER: "backend"
    AWS_REGION: "us-east-1"
    AWS_ENDPOINT_URL: "https://s3.us-east-1.amazonaws.com"
    FAIR_S3_UPLOAD_ACL: "public-read"

    # The image has no writable HOME.
    HOME: "/tmp"
    LOG_PATH: "/tmp/fair-logs"

    EMAIL_HOST: "email-smtp.us-east-1.amazonaws.com"
    EMAIL_PORT: "587"
    EMAIL_USE_TLS: "true"
    DEFAULT_FROM_EMAIL: "no-reply@fair.hotosm.org"

frontend:
  mode: "cloudfront"
  image:
    repository: ghcr.io/hotosm/fair/frontend
    pullPolicy: IfNotPresent

  runtimeEnv:
    VITE_BASE_API_URL: "https://api.ai.hotosm.org/api/v1/"
    VITE_FAIR_STAC_CATALOG_BASE_URL: "https://stac.ai.hotosm.org/stac"
    VITE_HANKO_URL: "https://login.hotosm.org"
    VITE_AUTH_PROVIDER: "hanko"
    VITE_FAIR_PROD_URL: "https://ai.hotosm.org"
    VITE_NODE_ENV: "production"

  # Bucket, distribution, OAC, policy and cert live in //terraform/
  # frontend_s3_cloudfront.tf - the Job only syncs and moves the origin path.
  cloudfront:
    roleArn: "arn:aws:iam::670261699094:role/hotosm-production-fair-frontend-deploy"
    region: "us-east-1"
    s3Bucket: "hotosm-fair-frontend-production"
