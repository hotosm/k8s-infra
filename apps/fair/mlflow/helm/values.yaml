# Keep aligned with staging except for production endpoints and infrastructure.
# Basic-auth users use per-pod SQLite, so replicas cannot share them.

replicaCount: 1

image:
  repository: ghcr.io/burakince/mlflow
  tag: "3.7.0"

initImages:
  mlflowDbMigration:
    repository: ghcr.io/burakince/mlflow
    tag: "3.7.0"

log:
  enabled: true
  level: info

telemetry:
  enabled: false

backendStore:
  # Enable only while applying database migrations.
  databaseMigration: false
  databaseConnectionCheck: true
  postgres:
    enabled: true
    host: "mlflow-prod-db-rw.postgres.svc.cluster.local"
    port: 5432
    database: "mlflow"
    driver: "psycopg2"
  existingDatabaseSecret:
    name: "mlflow-prod-db-creds"
    usernameKey: "username"
    passwordKey: "password"

artifactRoot:
  proxiedArtifactStorage: true
  defaultArtifactRoot: "./mlruns"
  defaultArtifactsDestination: "./mlartifacts"
  s3:
    enabled: true
    bucket: "hotosm-fair-mlflow-prod"
    path: ""
    existingSecret:
      name: "mlflow-s3-creds"
      keyOfAccessKeyId: "AWS_ACCESS_KEY_ID"
      keyOfSecretAccessKey: "AWS_SECRET_ACCESS_KEY"

auth:
  enabled: true
  existingAdminSecret:
    name: "mlflow-prod-admin-password"
    usernameKey: "adminUsername"
    passwordKey: "adminPassword"
ldapAuth:
  enabled: false
# Match the ZenML stack's tracking URI (mlflow...svc.cluster.local:5000); chart default is 80.
service:
  port: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: mlflow.ai.hotosm.org
    external-dns.alpha.kubernetes.io/ttl: "300"
  hosts:
    - host: mlflow.ai.hotosm.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - mlflow.ai.hotosm.org
      secretName: mlflow-production-tls
autoscaling:
  enabled: false

extraFlags: []

extraEnvVars:
  MLFLOW_SERVER_ALLOWED_HOSTS: "*"

extraSecretNamesForEnvFrom: []

resources: 
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceMonitor:
  enabled: false
  useServicePort: false
  namespace: monitoring
  interval: 30s
  telemetryPath: /metrics
  labels:
    release: prometheus
  timeout: 10s
  targetLabels: []
