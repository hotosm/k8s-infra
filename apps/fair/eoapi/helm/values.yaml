# Keep aligned with staging except for production endpoints and infrastructure.
ingress:
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: stac.ai.hotosm.org
    external-dns.alpha.kubernetes.io/ttl: "300"
  host: "stac.ai.hotosm.org"
  rootPath: "/"
  tls:
    enabled: true
    secretName: fair-prod-eoapi-tls

postgresql:
  # Database preparation is handled by fair-stac-prod.yaml.
  type: "external-secret"
  external:
    existingSecret:
      name: "fair-stac-prod-db-creds"
      keys:
        username: "username"
        password: "password"
        host: "host"
        port: "port"
        database: "database"

postgrescluster:
  enabled: false

pgstacBootstrap:
  enabled: true
  # Argo CD hooks ensure bootstrap jobs run during sync.
  configMaps:
    pgstacSettings:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-7"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    initdbSql:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-7"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    initdbJson:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-7"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    pgstacQueryables:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-7"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    initdb:
      annotations: {}
  jobs:
    pgstacSuperuserInitDb:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-6"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    pgstacMigrate:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-5"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    pgstacLoadSamples:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-4"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    pgstacLoadQueryables:
      annotations:
        argocd.argoproj.io/hook: Sync
        argocd.argoproj.io/sync-wave: "-3"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  settings:
    loadSamples: false
    queryables: []
    # Required until the chart can derive these from the external secret.
    user: fair_stac_prod
    database: fair-stac-prod

stac:
  enabled: true
  overrideRootPath: ""
  ingress:
    enabled: true
  settings:
    labels:
      project: fair
      tool: fair
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 512Mi
    extraEnvFrom: []
    extraVolumeMounts: []
    extraVolumes: []
    envVars:
      HOST: "0.0.0.0"
      PORT: "8080"
      # Each worker uses about 100Mi; adjust memory with concurrency.
      WEB_CONCURRENCY: "2"
      # Backend writes to pgstac via FAIR_STAC_DSN.
      ENABLE_TRANSACTIONS_EXTENSIONS: "false"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "5"
      STAC_FASTAPI_TITLE: "fAIr STAC Catalog"
      STAC_FASTAPI_DESCRIPTION: "STAC FastAPI deployment for fAIr model metadata tracking."

# Disabled services
apiServices:
  - stac
browser:
  enabled: false
docServer:
  enabled: false
raster:
  enabled: false
multidim:
  enabled: false
stac-auth-proxy:
  enabled: false
vector:
  enabled: false
eoapi-notifier:
  enabled: false
monitoring:
  metricsServer:
    enabled: false
  prometheus:
    enabled: false
observability:
  grafana:
    enabled: false
metrics-server:
  apiService:
    create: false
