windmill:
  baseDomain: tasks.k8s-prod.hotosm.org

  # Secret in the windmill namespace with the full Postgres URL under key `url`.
  databaseUrlSecretName: windmill-db-url

  # Disable LSP / Multiplayer / Debugger sidecar deployment.
  extraReplicas: 0

  workerGroups:

    # Basic scripts / baseline one job at a time, sequential
    - name: default
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
  
    # Autoscaled jobs based on tags/labels.
    # These scale from 0 based on KEDA, using the Postgres queue for windmill
    # as a trigger (see scaledobject.yaml).
    #
    # If there isn't enough resource to run the job, karpenter will autoscale
    # a new suitable node to handle it, then shut down, landing on the
    # cpu-autoscale Karpenter pool so nodes only exist while jobs run.
    #
    # replicas must be >= 1 for the chart to render the Deployment; KEDA then
    # owns the replica count (0..maxReplicaCount, see scaledobject.yaml). ArgoCD
    # ignores .spec.replicas for these Deployments (see apps/windmill.yaml
    # ignoreDifferences) so it does not fight KEDA scaling to zero.
    #
    # MANUAL STEP: WORKER_TAGS below makes a worker *register* its tag when it
    # scales up, but for a tag to be *selectable* on a script/flow it must also
    # be added to Windmill's "Assignable Tags" list (superadmin -> Workers tab
    # -> Assignable Tags). That list lives in the Windmill DB, not in these
    # manifests, so ArgoCD cannot manage it - add each tag once by hand:
    # osm-export-small, osm-export-medium, osm-export-big (tm-export later).
    # Scale-to-zero is fine once assigned: an assigned job queues with its tag,
    # KEDA counts it and scales a worker up to run it.

    # Requests are trimmed below the nominal node size so Karpenter packs each
    # pod onto the intended instance rather than bumping to the next size up.
    # Allow for the 7.5% vmMemoryOverheadPercent (see apps/karpenter/helm) plus
    # ~1-1.5Gi of kube/system-reserved + eviction + DaemonSets, and ~0.5 vCPU.
    # Targets a 4 vCPU / 8Gi (c*.xlarge) node.
    - name: osm-export-small
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: "6500Mi"
        limits:
          memory: "6500Mi"
      # Override as needed
      # image: ""
      # tag: ""
      nodeSelector:
        node-type: cpu
        nodegroup: autoscale
      tolerations:
        - key: spot
          operator: Exists
      extraEnv:
        - name: WORKER_TAGS
          value: "osm-export-small"

    # Targets a 4 vCPU / 16Gi (m*.xlarge) node.
    - name: osm-export-medium
      replicas: 1
      resources:
        requests:
          cpu: "3500m"
          memory: "14Gi"
        limits:
          memory: "14Gi"
      # Override as needed
      # image: ""
      # tag: ""
      nodeSelector:
        node-type: cpu
        nodegroup: autoscale
      tolerations:
        - key: spot
          operator: Exists
      extraEnv:
        - name: WORKER_TAGS
          value: "osm-export-medium"

    # Targets a 4 vCPU / 32Gi (r*.xlarge) node.
    - name: osm-export-big
      replicas: 1
      resources:
        requests:
          cpu: "3500m"
          memory: "28Gi"
        limits:
          memory: "28Gi"
      # Override as needed
      # image: ""
      # tag: ""
      nodeSelector:
        node-type: cpu
        nodegroup: autoscale
      tolerations:
        - key: spot
          operator: Exists
      extraEnv:
        - name: WORKER_TAGS
          value: "osm-export-big"

    # Tasking Manager exports. Needs an extended Windmill image with extra
    # Python deps before it can be enabled; see
    # https://github.com/hotosm/k8s-infra/issues/184
    # Uncomment (and the matching ScaledObject in scaledobject.yaml) once the
    # image is ready, filling in the image + tag below.
    # - name: tm-export
    #   replicas: 1
    #   resources:
    #     requests:
    #       cpu: "2"
    #       memory: "1500Mi"
    #     limits:
    #       memory: "1500Mi"
    #   # Extended image with the TM export Python deps (see issue #184)
    #   # image: ""
    #   # tag: ""
    #   nodeSelector:
    #     node-type: cpu
    #     nodegroup: autoscale
    #   tolerations:
    #     - key: spot
    #       operator: Exists
    #   extraEnv:
    #     - name: WORKER_TAGS
    #       value: "tm-export"

  # Full-text search indexer; off to save resources for now.
  indexer:
    enabled: false

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: tasks.k8s-prod.hotosm.org
    external-dns.alpha.kubernetes.io/ttl: "300"
  tls:
    - hosts:
        - tasks.k8s-prod.hotosm.org
      secretName: windmill-tls

# Chart bundles a demo Postgres (cloudnative-pg) plus a demo app; we use our
# own CNPG cluster in the postgres namespace, so disable both.
postgresql:
  enabled: false
