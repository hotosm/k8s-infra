# Imports GLO-30 into production pgstac once.
#
#   kubectl -n oam logs -f job/stac-ingest-glo30
#
# Delete the Job to run it again. ArgoCD will recreate it.
# Do not add a TTL, or ArgoCD will keep recreating the Job.
# Delete the Job before changing spec.template because it is immutable.
# Reruns are safe because the commands upsert the Collection before its Items.
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-ingest-glo30
  namespace: oam
  labels:
    app: stac-ingest-glo30
spec:
  # Stop stalled imports after one hour.
  activeDeadlineSeconds: 3600
  # Retry temporary API failures.
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: stac-ingest-glo30
    spec:
      restartPolicy: Never
      containers:
        - name: stac-ingest-glo30
          image: ghcr.io/hotosm/openaerialmap/stac-ingester:main
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          command:
            - "/bin/sh"
            - "-c"
          args:
            - |
              set -e

              # Create the Collection before importing Items.
              echo "Creating the GLO-30 Collection"
              hotosm sync-collection --catalog=GLO30

              echo "Beginning sync"
              # Add `--bbox MINX MINY MAXX MAXY` to limit the import.
              hotosm sync-glo30

              echo "Job complete"
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: oam-eoapi-pgstac-prod-db-creds
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: oam-eoapi-pgstac-prod-db-creds
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: oam-eoapi-pgstac-prod-db-creds
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: oam-eoapi-pgstac-prod-db-creds
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  key: database
                  name: oam-eoapi-pgstac-prod-db-creds
