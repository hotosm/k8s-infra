# Sync the legacy OpenAerialMap API data into pgstac db
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stac-ingest-oam
  namespace: oam
  labels:
    app: stac-ingest-oam
spec:
  # Every 30 minutes
  schedule: "*/30 * * * *"
  # Prevent overlapping 30-minute ingests.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  # Retain failed Jobs so their logs remain available for alert triage.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: stac-ingest-oam
        spec:
          restartPolicy: Never
          containers:
            - name: stac-ingest-oam
              image: ghcr.io/hotosm/openaerialmap/stac-ingester:main
              imagePullPolicy: Always
              resources:
                limits:
                  cpu: "768m"
                  memory: "4096Mi"
                requests:
                  cpu: "256m"
                  memory: "3072Mi"
              command:
                - "/bin/sh"
                - "-c"
              args:
                - |
                  # Exit immediately if a command exits with a non-zero status
                  set -e

                  # Database connection configured through standard PG* environment variables
                  # Environment variables are already set by the container

                  echo "Beginning sync"
                  # Overlap 3hrs for 30min scheduled cronjob
                  # IGNORE keeps one bad legacy item from blocking the window
                  hotosm sync-oam --uploaded-since 86400 --handle-exceptions IGNORE

                  echo "Job complete"
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      key: port
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      key: host
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      key: database
                      name: oam-eoapi-pgstac-prod-db-creds
      # The next overlapping run provides recovery without an in-Job retry.
      backoffLimit: 0
      activeDeadlineSeconds: 1500
