# Sync the current Maxar STAC catalog into pgstac db
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stac-ingest-maxar
  namespace: oam
  labels:
    app: stac-ingest-maxar
spec:
  # Every three hours, starting at midnight UTC.
  schedule: "0 */3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Retain failed Jobs so their logs remain available for alert triage.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: stac-ingest-maxar
        spec:
          restartPolicy: Never
          containers:
            - name: stac-ingest-maxar
              image: ghcr.io/hotosm/openaerialmap/stac-ingester:main
              imagePullPolicy: Always
              resources:
                limits:
                  cpu: "768m"
                  memory: "4096Mi"
                requests:
                  cpu: "256m"
                  memory: "3072Mi"
              command:
                - "/bin/sh"
                - "-c"
              args:
                - |
                  # Exit immediately if a command exits with a non-zero status
                  set -e

                  # Database connection configured through standard PG* environment variables
                  # Environment variables are already set by the container

                  echo "Beginning sync"
                  # The window filters whole events by their event_info.json date,
                  # so 24h missed every event Maxar listed later than it happened.
                  # Items already in pgstac are skipped, so 90 days is cheap.
                  hotosm sync-maxar --uploaded-since 7776000 --handle-exceptions IGNORE

                  echo "Job complete"
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      key: port
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      key: host
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      key: database
                      name: oam-eoapi-pgstac-prod-db-creds
      # The next three-hourly run provides recovery without an in-Job retry.
      backoffLimit: 0
      activeDeadlineSeconds: 7200
