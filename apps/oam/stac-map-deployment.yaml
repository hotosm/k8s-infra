# stac-map static UI, served at https://api.imagery.hotosm.org/map/
# Image tag must match STAC_MAP_REF in stac-map/Dockerfile and the
# frontend-stac-map-build.yml `image_tags` upstream - bump all three together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stac-map
  namespace: oam
  labels:
    app: stac-map
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stac-map
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stac-map
    spec:
      containers:
        - name: stac-map
          image: ghcr.io/hotosm/openaerialmap/stac-map:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /map/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /map/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: stac-map
  namespace: oam
  labels:
    app: stac-map
spec:
  selector:
    app: stac-map
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# nginx merges path rules across Ingresses sharing a host, so this adds `/map`
# without touching the eoapi chart. Host/TLS must match eoapi/helm/values.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stac-map
  namespace: oam
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.imagery.hotosm.org
      secretName: eoapi-tls
  rules:
    - host: api.imagery.hotosm.org
      http:
        paths:
          - path: /map
            pathType: Prefix
            backend:
              service:
                name: stac-map
                port:
                  name: http
