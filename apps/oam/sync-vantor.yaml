# Sync the Vantor open data STAC catalog into pgstac db.
# Needs `hotosm sync-collection --catalog=Vantor` run once first, see README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stac-ingest-vantor
  namespace: oam
  labels:
    app: stac-ingest-vantor
spec:
  # Every three hours from 02:00 UTC, clear of the Maxar sync.
  schedule: "0 2-23/3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # Retain failed Jobs so their logs remain available for alert triage.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: stac-ingest-vantor
        spec:
          restartPolicy: Never
          containers:
            - name: stac-ingest-vantor
              image: ghcr.io/hotosm/openaerialmap/stac-ingester:main
              imagePullPolicy: Always
              resources:
                limits:
                  cpu: "500m"
                  memory: "1Gi"
                requests:
                  cpu: "100m"
                  memory: "512Mi"
              command:
                - "/bin/sh"
                - "-c"
              args:
                - |
                  # Exit immediately if a command exits with a non-zero status
                  set -e

                  # Database connection configured through standard PG* environment variables
                  # Environment variables are already set by the container

                  echo "Beginning sync"
                  # Vantor has no index, so every run reads the whole catalogue
                  # regardless of window, and Items already in pgstac are skipped.
                  hotosm sync-vantor --uploaded-after 2020-01-01 --handle-exceptions IGNORE

                  echo "Job complete"
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      key: port
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      key: host
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: oam-eoapi-pgstac-prod-db-creds
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      key: database
                      name: oam-eoapi-pgstac-prod-db-creds
      # The next three-hourly run provides recovery without an in-Job retry.
      backoffLimit: 0
      activeDeadlineSeconds: 3600
