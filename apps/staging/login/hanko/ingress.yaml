# Served on both domains. dev.login DNS is switched by hand at cutover.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: login-staging
  name: hanko
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/enable-access-log: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: staging.login.hotosm.org
    external-dns.alpha.kubernetes.io/ttl: '300'
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - dev.login.hotosm.org
    - staging.login.hotosm.org
    secretName: hanko-tls
  rules:
  - host: dev.login.hotosm.org
    http:
      paths:
      - path: /.well-known
        pathType: ImplementationSpecific
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /registration
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /logout
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /sessions
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /passcode
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /webauthn
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /token
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /thirdparty
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /profile
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /emails
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /password
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /flow
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
  - host: staging.login.hotosm.org
    http:
      paths:
      - path: /.well-known
        pathType: ImplementationSpecific
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /registration
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /logout
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /sessions
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /passcode
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /webauthn
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /token
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /thirdparty
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
              name: http
      - path: /profile
        pathType: Prefix
        backend:
          service:
            name: hanko-public
            port:
