# Nepal-scoped GLO-30 ingest for staging, run on every sync.
#
# A PostSync hook, so ArgoCD deletes the previous Job before creating the next
# one - Job specs are immutable, and a plain Job would fail to sync as soon as
# the image tag moved. Same shape as the uploader chart's seed Job, which
# repopulates the throwaway catalogue on every sync for the same reason.
#
# --bbox keeps this to 12 Items rather than 26,450, which is enough to exercise
# the HREF rewrite, the Collection and a seam-crossing mosaic crop:
#
#   curl -o dem.tif "https://api.stage.imagery.hotosm.org/raster/collections\
#   /cop-dem-glo-30/bbox/85.9398611111,27.5998611111,86.0601388889,27.7001388889\
#   .tif?assets=data&width=433&height=361&return_mask=false"
#
# The image tag below is a placeholder: the appset pins it to sha-<head_sha>
# through kustomize, the same way it pins the frontend. See ../../oam.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: stac-ingest-glo30
  namespace: oam-staging
  labels:
    app: stac-ingest-glo30
  annotations:
    # After the Sync phase, so pgstac is up and its schema migrated.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: stac-ingest-glo30
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: stac-ingest-glo30
          image: ghcr.io/hotosm/openaerialmap/stac-ingester:main
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          command:
            - "/bin/sh"
            - "-c"
          args:
            - |
              set -e

              # Create the Collection before importing Items.
              echo "Creating the GLO-30 Collection"
              hotosm sync-collection --catalog=GLO30

              echo "Beginning sync"
              # Nepal only. Drop --bbox to harvest the whole globe.
              hotosm sync-glo30 --bbox 85.0 27.0 88.0 29.0

              echo "Job complete"
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: oam-stac-db-creds
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  key: port
                  name: oam-stac-db-creds
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  key: host
                  name: oam-stac-db-creds
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: oam-stac-db-creds
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  key: database
                  name: oam-stac-db-creds
