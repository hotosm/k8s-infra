apiVersion: v1
kind: ResourceQuota
metadata:
  name: oam-staging-quota
  namespace: oam-staging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # Whole stack plus a couple of 2-CPU workflow pods. Bump if syncs go pending.
  hard:
    requests.cpu: "6"
    requests.memory: 6Gi
    limits.cpu: "10"
    limits.memory: 10Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: oam-staging-limits
  namespace: oam-staging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
