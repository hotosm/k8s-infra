apiVersion: v1
kind: ServiceAccount
metadata:
  name: fair-model-deployer
  namespace: fair-staging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: knative-model-deployer-role
  namespace: fair-staging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
rules:
  # Strictly scoped to Knative Serving resources
  - apiGroups: ["serving.knative.dev"]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: knative-model-deployer-binding
  namespace: fair-staging
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: knative-model-deployer-role
subjects:
  - kind: ServiceAccount
    name: fair-model-deployer
    namespace: fair-staging