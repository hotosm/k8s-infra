apiVersion: batch/v1
kind: Job
metadata:
  name: fair-model-reconciliation
  namespace: fair-staging
  annotations:
    # Triggers the job after the main deployment syncs
    argocd.argoproj.io/hook: PostSync
    # Automatically deletes the job after it succeeds so it doesn't block future syncs
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: fair-model-deployer
      restartPolicy: Never
      containers:
        - name: model-reconciler
          # Uses the standard staging backend image
          image: ghcr.io/hotosm/fair-backend:latest 
          command: ["python", "manage.py", "reconcile_models"]