# The whole OpenAerialMap stack, in the `oam` namespace. See apps/oam/README.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oam
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://devseed.com/eoapi-k8s
      chart: eoapi
      targetRevision: 0.15.0
      helm:
        releaseName: eoapi
        skipCrds: false
        passCredentials: false
        valueFiles:
          - $k8s-infra/apps/oam/eoapi/helm/values.yaml

    - repoURL: oci://ghcr.io/hotosm/charts/openaerialmap/tilepack-api
      chart: tilepack-api
      targetRevision: 0.4.3
      helm:
        releaseName: tilepack-api
        valueFiles:
          - $k8s-infra/apps/oam/tilepack-api/helm/values.yaml

    - repoURL: oci://ghcr.io/hotosm/charts/openaerialmap/global-tms
      chart: global-tms
      targetRevision: 0.2.10
      helm:
        releaseName: global-tms
        # Chart defaults are fine

    - repoURL: oci://ghcr.io/hotosm/charts/openaerialmap/uploader-api
      chart: uploader-api
      targetRevision: 0.2.0
      helm:
        # WF_CALLBACK_URL default is derived from this release name.
        releaseName: uploader-api
        valueFiles:
          - $k8s-infra/apps/oam/uploader-api/helm/values.yaml

    # GeoTIFF pipeline WorkflowTemplate, kept upstream. Tracks `main`, so local
    # pipeline edits must be merged there before they take effect here.
    - repoURL: https://github.com/hotosm/openaerialmap.git
      targetRevision: main
      path: backend/uploader-api/pipeline
      directory:
        include: workflow-template.yaml

    # Resolves $k8s-infra in the valueFiles above
    - repoURL: https://github.com/hotosm/k8s-infra.git
      targetRevision: HEAD
      ref: k8s-infra

    # Non-recursive: applies apps/oam/*.yaml only, not the values files
    - repoURL: https://github.com/hotosm/k8s-infra.git
      targetRevision: HEAD
      path: apps/oam
  destination:
    server: https://kubernetes.default.svc
    namespace: oam
  syncPolicy:
    automated:
      selfHeal: true
      # Migration: prune would delete the old `eoapi` ns stack we roll back to
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
