# kube-prometheus-stack: one Operator for the whole cluster
# Apps opt in with a ServiceMonitor/PodMonitor in any namespace (see README)

prometheus:
  prometheusSpec:
    # Discover monitors/rules cluster-wide, not just this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 30d
    retentionSize: "45GB"   # stay under the PVC below
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 4Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 50Gi } }

alertmanager:
  # Enabled with no receivers yet - add Slack/email routing when ready
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 5Gi } }

grafana:
  # Admin creds from a sealed secret, avoids a random chart-generated password
  admin:
    existingSecret: grafana-admin-creds
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
  # The chart defaults to RollingUpdate, which deadlocks against the RWO PVC
  # above: the new pod can't attach the volume until the old one releases it,
  # and the old one isn't torn down until the new one is Ready. Replace instead.
  deploymentStrategy:
    type: Recreate
  # On the tailnet (no public ingress)
  service:
    type: LoadBalancer
    loadBalancerClass: tailscale
    annotations:
      tailscale.com/hostname: grafana
  # Auto-import app dashboards shipped as ConfigMaps labelled grafana_dashboard
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespaces: ALL

# Cluster collectors enabled explicitly
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  # cAdvisor only labels container metrics with `pod`, so on its own you can't
  # tell which Argo workflow a pod belonged to. Surfacing these labels as
  # kube_pod_labels / kube_node_labels series lets PromQL join them, e.g.
  #
  #   container_memory_working_set_bytes{namespace="odm"}
  #     * on (namespace, pod) group_left(label_workflows_argoproj_io_workflow)
  #       kube_pod_labels{namespace="odm"}
  #
  # Both are bounded: pod series disappear with PodGC, nodes with the node.
  metricLabelsAllowlist:
    - "pods=[workflows.argoproj.io/workflow]"
    - "nodes=[karpenter.sh/nodepool,karpenter.sh/capacity-type,node.kubernetes.io/instance-type]"
