# kube-prometheus-stack: one Operator for the whole cluster
# Apps opt in with a ServiceMonitor/PodMonitor in any namespace (see README)

prometheus:
  prometheusSpec:
    # Base URL for links Prometheus emits; see ../tailscale-services.yaml
    externalUrl: http://prometheus.banded-armadillo.ts.net
    # Discover monitors/rules cluster-wide, not just this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 30d
    retentionSize: "45GB"   # stay under the PVC below
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 4Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 50Gi } }

alertmanager:
  alertmanagerSpec:
    # Base URL for the links Alertmanager puts in Slack messages
    externalUrl: http://alertmanager.banded-armadillo.ts.net
    secrets:
      - alertmanager-slack
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 5Gi } }

  # Route critical alerts to Slack and leave other alerts in the UI.
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
      routes:
        # Discard the chart's always-firing heartbeat alert.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        # Staging is per-PR and churns by design - UI only, never Slack.
        - receiver: "null"
          matchers:
            - namespace =~ ".*-staging"
        - receiver: "slack-critical"
          matchers:
            - severity = "critical"

    # Drop duplicates of one condition. Never mutes an availability alert on an
    # assumed cause - that is how a real outage goes unnoticed.
    inhibit_rules:
      # Backlog is the archive failure restated. `job` is the CNPG cluster.
      - source_matchers:
          - alertname = "CNPGWALArchiveFailing"
        target_matchers:
          - alertname = "CNPGWALArchiveBacklog"
        equal: ["namespace", "job"]

      # Same pod, same meaning.
      - source_matchers:
          - alertname = "CNPGInstanceDown"
        target_matchers:
          - alertname = "CNPGTargetUnreachable"
        equal: ["namespace", "pod"]

      # Zero replicas also trips the partial-availability rules.
      - source_matchers:
          - alertname = "DeploymentNoReplicasAvailable"
        target_matchers:
          - alertname =~ "DeploymentMostReplicasUnavailable|DeploymentReplicasUnavailable"
        equal: ["namespace", "deployment"]

      # Keep the critical, drop the warning twin.
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace"]

    receivers:
      - name: "null"
      - name: "slack-critical"
        slack_configs:
          - channel: "#hot-tech-alerts"
            send_resolved: true

grafana:
  # Admin creds from a sealed secret, avoids a random chart-generated password
  admin:
    existingSecret: grafana-admin-creds
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
  # The chart defaults to RollingUpdate, which deadlocks against the RWO PVC
  # above: the new pod can't attach the volume until the old one releases it,
  # and the old one isn't torn down until the new one is Ready. Replace instead.
  deploymentStrategy:
    type: Recreate
  # On the tailnet (no public ingress)
  service:
    type: LoadBalancer
    loadBalancerClass: tailscale
    annotations:
      tailscale.com/hostname: grafana
  # Auto-import app dashboards shipped as ConfigMaps labelled grafana_dashboard
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespaces: ALL

# Cluster collectors enabled explicitly
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

# EKS-managed control plane: nothing to scrape, so their *Down alerts always fire
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

kube-state-metrics:
  # cAdvisor only labels container metrics with `pod`, so on its own you can't
  # tell which Argo workflow a pod belonged to. Surfacing these labels as
  # kube_pod_labels / kube_node_labels series lets PromQL join them, e.g.
  #
  #   container_memory_working_set_bytes{namespace="odm"}
  #     * on (namespace, pod) group_left(label_workflows_argoproj_io_workflow)
  #       kube_pod_labels{namespace="odm"}
  #
  # Both are bounded: pod series disappear with PodGC, nodes with the node.
  metricLabelsAllowlist:
    - "pods=[workflows.argoproj.io/workflow]"
    - "nodes=[karpenter.sh/nodepool,karpenter.sh/capacity-type,node.kubernetes.io/instance-type]"
