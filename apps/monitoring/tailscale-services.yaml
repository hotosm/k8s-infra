# Alertmanager + Prometheus on the tailnet, so links in Slack alerts resolve.
# Standalone because the chart's Service templates have no loadBalancerClass.
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-tailscale
  namespace: monitoring
  annotations:
    tailscale.com/hostname: "alertmanager"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: alertmanager
    alertmanager: monitoring-kube-prometheus-alertmanager
  ports:
    - name: http-web
      port: 80
      targetPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-tailscale
  namespace: monitoring
  annotations:
    tailscale.com/hostname: "prometheus"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: monitoring-kube-prometheus-prometheus
  ports:
    - name: http-web
      port: 80
      targetPort: 9090
