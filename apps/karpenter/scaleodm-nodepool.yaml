# Dedicated ScaleODM pool: x86 c/m/r nodes with local-NVMe swap (scaleodm-swap
# EC2NodeClass). Tainted so only ScaleODM workflow pods land here; all other
# node-type=cpu workloads (e.g. Windmill) stay on the cheaper cpu-autoscale
# pool. Scales to zero when idle.

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: scaleodm
spec:
  template:
    metadata:
      labels:
        pool: scaleodm
    spec:
      nodeClassRef:
        name: scaleodm-swap
        group: karpenter.k8s.aws
        kind: EC2NodeClass

      # Only pods that tolerate this taint (ScaleODM workflow pods) schedule
      # here. ScaleODM sets the matching toleration + nodeSelector in its Helm
      # values (config.workflow.tolerations / nodeSelector).
      taints:
        - key: dedicated
          value: scaleodm
          effect: NoSchedule

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        # c/m/r families only (avoid storage-optimised i/d families).
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]

        # Require local NVMe (GB) for the swap file, instead of hardcoding "d"
        # family names that vary by generation. Picks up any NVMe family.
        - key: karpenter.k8s.aws/instance-local-nvme
          operator: Gt
          values: ["100"]

        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16", "32", "48"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

  limits:
    # Aggregate cap for the whole pool (all ODM jobs share it, Argo parallelism
    # 5). The cap counts each node's *full* capacity, not the pod's request: a
    # ~6k-image --dsm --dtm job requests ~216Gi and lands on an r6id.12xlarge,
    # which alone consumes 48 CPU / 372Gi. So this is really "how many big jobs
    # run concurrently" -- 1536Gi fits three, and CPU is deliberately slack so
    # memory stays the binding constraint. Cost-vs-concurrency dial.
    #
    # Overflow beyond the cap pends, and that pending time counts against the
    # workflow activeDeadlineSeconds (48h, see apps/scaleodm/helm/values.yaml).
    # Diagnosing this is unintuitive: Karpenter filters candidate instance types
    # against the *remaining* limit headroom, so a pool at its cap reports
    # "no instance type has enough resources" (with the full requirements dump)
    # rather than naming the limit. If a pending ODM pod shows that, check
    # `kubectl get nodepool scaleodm -o jsonpath='{.status.resources}'` against
    # these values before touching the instance-type requirements above.
    cpu: "192"
    memory: 1536Gi

  disruption:
    # WhenEmpty only, so a node running a multi-hour ODM job is never
    # consolidated mid-run. The node is removed once its job finishes.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
