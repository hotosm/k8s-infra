# CPU NodePool for fAIr training. GPU training (mlm:accelerator cuda) uses gpu-nodepool-fair.yaml:
# it requests nvidia.com/gpu, which these instances do not offer.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu-autoscale-fair-training
spec:
  template:
    metadata:
      labels:
        nodegroup: autoscale
        node-type: cpu
        fair-k8s/training: "true"
    spec:
      nodeClassRef:
        name: autoscale
        group: karpenter.k8s.aws
        kind: EC2NodeClass

      taints:
        - key: fair-k8s/training
          value: "true"
          effect: NoSchedule

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c6a", "c6i", "c7a", "c7i", "m6a", "m6i", "m7a", "m7i"]

        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["4", "8", "16"]

        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]

        # On-demand: a spot interruption would kill a training step mid-run.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

  limits:
    cpu: "32"
    memory: 128Gi

  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s
