apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudnativepg
resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.30.0/releases/cnpg-1.30.0.yaml
  # Barman plugin required for backups since CNPG v1.26.0.
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.14.0/manifest.yaml
commonAnnotations:
  argocd.argoproj.io/sync-options: ServerSideApply=true
