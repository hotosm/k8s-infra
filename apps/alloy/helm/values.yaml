alloy:
  # Keep file read positions on the node, so a restarted pod resumes where it
  # stopped instead of re-shipping every log file (default /tmp is lost).
  storagePath: /var/lib/alloy
  mounts:
    varlog: true
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  configMap:
    content: |
      // Pods on this node only (HOSTNAME is the node name in this chart).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Keep labels low-cardinality: Loki indexes labels, not log text.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // Loki derives service_name from `app`, which Grafana Drilldown groups by.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          regex         = "^;*([^;]+)(;.*)?$"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Strip the containerd CRI prefix (timestamp, stream, flags).
      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc:3100/loki/api/v1/push"
        }
      }

controller:
  volumes:
    extra:
      - name: alloy-data
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
  # Every node, including tainted fAIr/GPU pools.
  tolerations:
    - operator: Exists

# The chart's default ClusterRole reads every Secret in the cluster, from a pod
# on every node. Our config only discovers pods, so grant just that.
rbac:
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]
  # Must be non-empty (the chart renders invalid YAML for []); node objects are harmless.
  clusterRules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]

# Alloy's own metrics (loki_write_* dropped/failed entries) into Prometheus.
serviceMonitor:
  enabled: true
