# Cluster-wide core resources: RBAC roles/bindings and StorageClasses.
# No destination namespace - these are cluster-scoped, apart from the contractor
# RoleBindings, which set their own namespace from values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hotosm/k8s-infra.git'
    path: 'apps/cluster-core'
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
