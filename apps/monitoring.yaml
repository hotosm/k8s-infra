# Cluster-wide Prometheus Operator (issue #134). Apps ship a ServiceMonitor and
# this stack discovers + scrapes them. Grafana is exposed on the tailnet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.1.5
      helm:
        releaseName: monitoring
        valueFiles:
          - $k8s-infra/apps/monitoring/helm/values.yaml
    - repoURL: https://github.com/hotosm/k8s-infra.git
      targetRevision: HEAD
      ref: k8s-infra
    # Sealed grafana-admin-creds (non-recursive; skips helm/).
    - repoURL: https://github.com/hotosm/k8s-infra.git
      targetRevision: HEAD
      path: apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # The stack's CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
