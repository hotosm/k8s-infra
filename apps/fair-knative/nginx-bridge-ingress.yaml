# Bridges nginx to Kourier for fAIr model traffic.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knative-nginx-bridge
  namespace: knative-serving
  annotations:
    kubernetes.io/ingress.class: nginx
    external-dns.alpha.kubernetes.io/hostname: "*.predict.ai.hotosm.org"
    external-dns.alpha.kubernetes.io/ttl: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Kourier routes models by host.
    nginx.ingress.kubernetes.io/upstream-vhost: $host
    # Allow time for cold-start node provisioning.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - secretName: fair-predict-wildcard-tls
      hosts:
        - "*.predict.ai.hotosm.org"
  rules:
  - host: "*.predict.ai.hotosm.org" 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kourier
            port:
              number: 80
