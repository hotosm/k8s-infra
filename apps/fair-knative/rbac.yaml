apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: knative-model-deployer-role
  namespace: fair-knative
rules:
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "configurations", "routes", "revisions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: knative-model-deployer-binding-staging
  namespace: fair-knative
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: knative-model-deployer-role
subjects:
  - kind: ServiceAccount
    name: fair-model-deployer
    namespace: fair-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: knative-model-deployer-binding-prod
  namespace: fair-knative
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: knative-model-deployer-role
subjects:
  - kind: ServiceAccount
    name: fair-model-deployer
    namespace: fair-prod
